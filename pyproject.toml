[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-limbo"
version = "0.1.1"
description = "Local Codex usage and quota monitor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["rich>=13,<15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
codex-limbo = "codex_limbo.cli:main"

[tool.setuptools.packages.find]
include = ["codex_limbo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
