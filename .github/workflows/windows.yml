name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Installer
        shell: pwsh
        run: ./install.ps1
